name: CI Pipeline

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.jobs
        uses: actions/setup-node@v3
        with:
          node-version: 20

      - name: Install Dependencies
        run: |
          yarn install --frozen-lockfile

      - name: Run tests
        run: yarn test

      - name: Check Coverage
        run: npx c8 --check-coverage --lines 80 --branches 80 yarn test